[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-data-stack"
version = "0.1.0"
description = "Local-first equity research data lake on Parquet + DuckDB."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["finance", "equities", "parquet", "duckdb", "polygon"]
authors = [{ name = "David Gavin", email = "davidgavin01@gmail.com" }]

dependencies = [
  "massive>=2.0.0",
  "boto3>=1.34",
  "duckdb>=0.10.0",
  "exchange-calendars>=4.3",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "requests>=2.31",
  "typer>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "mypy>=1.8",
  "types-requests>=2.31",
]

[project.scripts]
equity-stack = "equity_data_stack.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["equity_data_stack*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM", "PIE"]
ignore = ["E203", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
